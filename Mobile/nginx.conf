server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Any route that doesn't have a file extension (e.g. /login)
    # should be redirected to index.html so the SPA router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
